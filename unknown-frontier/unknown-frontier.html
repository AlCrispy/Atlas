<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unknown Frontier</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/unknown-frontier.css">
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="../index.html">← <span>Le Ambientazioni</span></a>
  <span class="topbar-title">Unknown Frontier</span>
</div>

<div id="solar-system" class="solar-system-canvas">
  <p class="hz-hint">Trascina per ruotare · Scroll per zoom · Click su un punto per info</p>
</div>
<div id="hud-column" class="hud-column">
  <div id="beacon-card" class="beacon-card">
    <button class="beacon-card-close" aria-label="Chiudi">&times;</button>
    <p class="placeholder-badge">In Costruzione</p>
    <p class="placeholder-eyebrow beacon-card-eyebrow">Sistema Solare</p>
    <h3 class="beacon-card-title">Punto sconosciuto</h3>
    <a class="beacon-card-link" href="#">Esplora →</a>
  </div>
  <div id="compare-panel" class="compare-panel is-collapsed">
    <button type="button" class="compare-panel-title" aria-expanded="false">
      <span>Confronta Distanze</span>
      <span class="compare-panel-caret" aria-hidden="true">▾</span>
    </button>
    <div class="compare-panel-body">
      <label class="compare-slot">
        <span class="compare-slot-label">Stella A</span>
        <select class="compare-select" data-slot="a"><option value="">—</option></select>
      </label>
      <label class="compare-slot">
        <span class="compare-slot-label">Stella B</span>
        <select class="compare-select" data-slot="b"><option value="">—</option></select>
      </label>
      <p class="compare-distance">Seleziona due stelle</p>
      <button type="button" class="compare-clear">Azzera</button>
    </div>
  </div>
  <div id="system-list" class="system-list is-collapsed">
    <button type="button" class="system-list-title" aria-expanded="false">
      <span>Sistemi Rilevati</span>
      <span class="system-list-caret" aria-hidden="true">▾</span>
    </button>
    <ul class="system-list-items"></ul>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="js/galaxy.js"></script>

</body>
</html>
