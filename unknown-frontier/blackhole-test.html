<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Hole Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #060a0a; }
  #status { position: fixed; top: 8px; left: 8px; color: #6f6; font: 12px monospace; z-index: 10; white-space: pre-wrap; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="status">loading...</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.webgpu.min.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.webgpu.min.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.tsl.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createBlackHole } from './js/black-hole.js';

const statusEl = document.getElementById('status');
function log(s) { statusEl.textContent += '\n' + s; console.log(s); }

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 30, 60);

const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

log('renderer created, calling init()...');

const blackHole = createBlackHole({ scene, camera, position: [0, 0, 0] });
log('black hole mesh created');

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let frameCount = 0;
function animate() {
  requestAnimationFrame(animate);
  blackHole.update();
  controls.update();
  renderer.render(scene, camera);
  frameCount++;
  if (frameCount === 1) log('first frame rendered');
  if (frameCount === 60) log('60 frames rendered OK');
}

renderer.init().then(() => {
  log('renderer.init() resolved OK — backend: ' + (renderer.backend?.isWebGPUBackend ? 'WebGPU' : 'WebGL2 fallback'));
  animate();
}).catch((err) => {
  log('renderer.init() REJECTED: ' + err.message);
  console.error(err);
});
</script>
</body>
</html>
