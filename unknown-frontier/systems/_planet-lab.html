<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Planet Lab — scratch, not linked from the site</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #060a0a;
    color: #ccd4d0;
    font: 13px/1.4 monospace;
    overflow: hidden;
  }
  #viewport { position: fixed; inset: 0; }
  #panel {
    position: fixed;
    top: 12px;
    left: 12px;
    width: 260px;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    background: rgba(6, 10, 10, 0.88);
    border: 1px solid rgba(201, 168, 76, 0.35);
    border-radius: 8px;
    padding: 12px;
  }
  #panel h1 {
    font-size: 13px;
    margin: 0 0 10px;
    color: #c9a84c;
    letter-spacing: 0.05em;
  }
  #panel label { display: block; margin-top: 10px; color: #8fa39c; }
  #panel select, #panel input[type="text"], #panel input[type="range"] { width: 100%; }
  #panel input[type="checkbox"] { margin-right: 6px; }
  #panel .row { display: flex; align-items: center; gap: 8px; }
  #panel .row output { width: 42px; text-align: right; color: #ccd4d0; }
  #panel button {
    width: 100%;
    margin-top: 12px;
    padding: 6px;
    background: #c9a84c;
    color: #060a0a;
    border: none;
    border-radius: 4px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  #panel .hint { color: #5c6f68; margin-top: 12px; font-size: 11px; }
  #panel .swatch { display: inline-block; width: 100%; margin-top: 6px; border: 1px solid #2a332f; image-rendering: pixelated; }
</style>
</head>
<body>

<div id="viewport"></div>

<div id="panel">
  <h1>🪐 PLANET LAB (scratch — not linked from the site)</h1>

  <label>Tipo
    <select id="planetType">
      <option value="roccioso">Roccioso</option>
      <option value="desertico">Desertico</option>
      <option value="vulcanico">Vulcanico</option>
      <option value="oceanico" selected>Oceanico</option>
      <option value="glaciale">Glaciale</option>
      <option value="giungla">Giungla</option>
      <option value="tossico">Tossico</option>
      <option value="esotico">Esotico</option>
      <option value="gg">Gigante gassoso</option>
      <option value="gh">Gigante di ghiaccio</option>
      <option value="">(nessuno — fallback per luna)</option>
    </select>
  </label>

  <label>Slug (seed) <input type="text" id="slug" value="lab-test-a"></label>
  <label>Size (per fallback gas/icy roll) <div class="row"><input type="range" id="size" min="0.5" max="3" step="0.05" value="1.5"><output></output></div></label>

  <label><input type="checkbox" id="useRealLighting" checked> Illuminazione reale del sito (Hemisphere + Directional)</label>
  <label><input type="checkbox" id="autoRotate" checked> Auto-rotazione</label>

  <button id="regen">Rigenera texture (nuovo giro)</button>

  <h1 style="margin-top:16px">🌊 Prototipo oceanico</h1>
  <label><input type="checkbox" id="protoOceanEnabled" checked> Attivo (bypassa makePlanetTexture)</label>

  <label>Modalità
    <select id="oceanMode">
      <option value="photo" selected>Foto Terra distorta (nuovo)</option>
      <option value="flat">Livelli piatti (precedente)</option>
    </select>
  </label>

  <div id="photoControls">
    <label>Scala warp <div class="row"><input type="range" id="protoWarpScale" min="0.5" max="6" step="0.1" value="1.8"><output></output></div></label>
    <label>Intensità warp <div class="row"><input type="range" id="protoWarpAmount" min="0" max="0.3" step="0.005" value="0.12"><output></output></div></label>
    <label>Rotazione tonalità <div class="row"><input type="range" id="protoHueShift" min="-0.5" max="0.5" step="0.01" value="0"><output></output></div></label>
    <label>Saturazione <div class="row"><input type="range" id="protoSatMul" min="0.3" max="1.8" step="0.02" value="1"><output></output></div></label>
    <label>Luminosità <div class="row"><input type="range" id="protoLightAdd" min="-0.3" max="0.3" step="0.01" value="0"><output></output></div></label>
  </div>

  <div id="flatControls" style="display:none">
    <label>Colore oceano <input type="color" id="protoOceanColor" value="#3a72a3"></label>
    <label>Colore terreno <input type="color" id="protoLandColor" value="#a08a5c"></label>
    <label>Colore foresta <input type="color" id="protoForestColor" value="#2f6b3a"></label>

    <label>Scala terreno <div class="row"><input type="range" id="protoLandScale" min="1" max="8" step="0.1" value="3"><output></output></div></label>
    <label>Copertura terreno <div class="row"><input type="range" id="protoLandThreshold" min="0.3" max="0.8" step="0.01" value="0.55"><output></output></div></label>
    <label>Nitidezza costa <div class="row"><input type="range" id="protoEdgeSharpness" min="0" max="0.15" step="0.002" value="0.015"><output></output></div></label>
    <label>Margine oceano ai bordi (anti-giuntura) <div class="row"><input type="range" id="protoSeamMargin" min="0" max="0.25" step="0.005" value="0.12"><output></output></div></label>
    <label>Scala foresta <div class="row"><input type="range" id="protoForestScale" min="2" max="15" step="0.1" value="6"><output></output></div></label>
    <label>Copertura foresta <div class="row"><input type="range" id="protoForestThreshold" min="0.3" max="0.8" step="0.01" value="0.5"><output></output></div></label>
  </div>

  <label>Anteprima texture 2D (quella che va sulla sfera)</label>
  <canvas id="preview" class="swatch" width="256" height="128"></canvas>

  <p class="hint">Usa la vera <code>makePlanetTexture</code> da js/planet-texture.js — nessuna reimplementazione. Trascina per ruotare · scroll per zoom.</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { makePlanetTexture } from '../js/planet-texture.js';

const viewport = document.getElementById('viewport');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 0, 3.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
viewport.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.4;
controls.maxDistance = 20;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;

// Same rig as solar-system.js's makeBodyMesh lighting, so this lab shows
// exactly what the real site would render — flip off to isolate whether
// an issue is in the texture itself vs. how the scene lights it.
const hemi = new THREE.HemisphereLight(0xffffff, 0x0a0e18, 0.9);
const sun = new THREE.DirectionalLight(0xfff2d6, 1.3);
sun.position.set(40, 60, 30);
scene.add(hemi, sun);

// A flat, even fill so the texture's own colors are visible undistorted
// by the site's lighting — the "is it the texture or the lighting"
// toggle's off state.
const flatLight = new THREE.AmbientLight(0xffffff, 1.2);

const geometry = new THREE.SphereGeometry(1, 48, 48);
let material = new THREE.MeshStandardMaterial({ roughness: 0.8, metalness: 0.05 });
const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

const previewCanvas = document.getElementById('preview');
const previewCtx = previewCanvas.getContext('2d');

// === Ocean prototype: real Earth photo, warped + recolored per slug ===
// The flat-layer prototype below still read as too basic/blobby — this
// mode starts from the actual real_atmos_2048.jpg (same file the real
// Sol-system Terra page uses) for genuine coastline/terrain/cloud detail,
// then domain-warps it (so it isn't literally recognizable as Earth) and
// hue/sat/lightness-shifts it per slug for variety between planets. Only
// possible because it's a *real equirectangular photo*, already seamless
// at u=0/u=1 — the warp sampling wraps u with modulo so that stays true.
const earthPhoto = new Image();
earthPhoto.src = '../resources/planet-textures/earth_atmos_2048.jpg';
let earthCanvas = null; // built once the photo has actually loaded

function ensureEarthCanvas() {
  if (earthCanvas || !earthPhoto.complete || !earthPhoto.naturalWidth) return earthCanvas;
  earthCanvas = document.createElement('canvas');
  earthCanvas.width = earthPhoto.naturalWidth;
  earthCanvas.height = earthPhoto.naturalHeight;
  earthCanvas.getContext('2d').drawImage(earthPhoto, 0, 0);
  return earthCanvas;
}
earthPhoto.addEventListener('load', () => { ensureEarthCanvas(); regenerate(); });

function paintOceanFromPhoto(ctx, w, h, seed, opts) {
  const src = ensureEarthCanvas();
  if (!src) return false; // not loaded yet — caller falls back

  const srcCtx = src.getContext('2d');
  const srcData = srcCtx.getImageData(0, 0, src.width, src.height).data;
  const { fbm } = makeNoise2D(seed);
  const img = ctx.createImageData(w, h);
  const c = new THREE.Color();
  const hsl = { h: 0, s: 0, l: 0 };

  for (let y = 0; y < h; y++) {
    const v = y / h;
    for (let x = 0; x < w; x++) {
      const u = x / w;
      const nx = u * opts.warpScale;
      const ny = v * opts.warpScale;
      const wx = (fbm(nx + 11.3, ny + 37.7, 4) - 0.5) * opts.warpAmount;
      const wy = (fbm(nx - 19.1, ny + 53.9, 4) - 0.5) * opts.warpAmount;

      const su = ((u + wx) % 1 + 1) % 1; // wrap horizontally — keeps the photo's own seam intact
      const sv = clamp01(v + wy); // clamp vertically, no pole to wrap around

      const sx = Math.min(src.width - 1, Math.floor(su * src.width));
      const sy = Math.min(src.height - 1, Math.floor(sv * src.height));
      const sIdx = (sy * src.width + sx) * 4;

      c.setRGB(srcData[sIdx] / 255, srcData[sIdx + 1] / 255, srcData[sIdx + 2] / 255);
      c.getHSL(hsl);
      c.setHSL(((hsl.h + opts.hueShift) % 1 + 1) % 1, clamp01(hsl.s * opts.satMul), clamp01(hsl.l + opts.lightAdd));

      const idx = (y * w + x) * 4;
      img.data[idx] = c.r * 255;
      img.data[idx + 1] = c.g * 255;
      img.data[idx + 2] = c.b * 255;
      img.data[idx + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return true;
}

// === Ocean prototype — flat color fields instead of noisy/blurred shading ===
// The live-tuned replacement for planet-texture.js's paintOcean/paintRegions:
// user feedback was that the fbm-shaded version reads as too smeared/grainy.
// This version is three flat-color layers (ocean, then land blobs cut from
// it, then forest blobs cut from the land) with a near-hard edge instead of
// a soft coastSoftness gradient — no per-pixel lightness jitter anywhere.
// Self-contained (own tiny hash/noise) so it can be tuned freely here without
// touching the real module until the look is locked in.
function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function hashLattice(seed, ix, iy) {
  let h = seed | 0;
  h ^= Math.imul(ix | 0, 0x27d4eb2f);
  h ^= Math.imul(iy | 0, 0x165667b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h ^= h >>> 13;
  h = Math.imul(h, 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}

function smootherstep(t) { return t * t * (3 - 2 * t); }

function makeNoise2D(seed) {
  function noise2D(x, y) {
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const sx = smootherstep(x - x0), sy = smootherstep(y - y0);
    const n00 = hashLattice(seed, x0, y0);
    const n10 = hashLattice(seed, x0 + 1, y0);
    const n01 = hashLattice(seed, x0, y0 + 1);
    const n11 = hashLattice(seed, x0 + 1, y0 + 1);
    const ix0 = n00 + (n10 - n00) * sx;
    const ix1 = n01 + (n11 - n01) * sx;
    return ix0 + (ix1 - ix0) * sy;
  }
  function fbm(x, y, octaves = 4, lacunarity = 2, persistence = 0.5) {
    let amp = 1, freq = 1, sum = 0, norm = 0;
    for (let o = 0; o < octaves; o++) {
      sum += noise2D(x * freq, y * freq) * amp;
      norm += amp;
      amp *= persistence;
      freq *= lacunarity;
    }
    return sum / norm;
  }
  return { noise2D, fbm };
}

function clamp01(v) { return Math.min(1, Math.max(0, v)); }

function paintOceanPrototype(ctx, w, h, seed, opts) {
  const { fbm } = makeNoise2D(seed);
  const oc = new THREE.Color(opts.oceanColor);
  const lc = new THREE.Color(opts.landColor);
  const fc = new THREE.Color(opts.forestColor);
  const img = ctx.createImageData(w, h);
  const c = new THREE.Color();

  for (let y = 0; y < h; y++) {
    const v = y / h;
    for (let x = 0; x < w; x++) {
      const u = x / w;

      const landN = fbm(u * opts.landScale, v * opts.landScale, 4);
      let landT = opts.edgeSharpness > 0
        ? clamp01((landN - opts.landThreshold) / opts.edgeSharpness)
        : (landN > opts.landThreshold ? 1 : 0);

      // The fbm field isn't periodic in u, so u=0 and u=1 sample unrelated
      // noise — wrapped onto a sphere that's the equirectangular seam
      // showing up as a visible hard break in the coastline. Rather than
      // making the noise itself wrap (a bigger rewrite), guarantee a strip
      // of pure ocean along both edges so the seam is always ocean-meeting-
      // ocean, which is seamless because it's a single flat color.
      if (opts.seamMargin > 0) {
        const edgeDist = Math.min(u, 1 - u);
        landT *= clamp01(edgeDist / opts.seamMargin);
      }

      if (landT <= 0) {
        c.copy(oc);
      } else {
        const forestN = fbm(u * opts.forestScale + 50, v * opts.forestScale + 50, 3);
        const forestT = opts.edgeSharpness > 0
          ? clamp01((forestN - opts.forestThreshold) / opts.edgeSharpness)
          : (forestN > opts.forestThreshold ? 1 : 0);

        c.copy(oc).lerp(lc, landT);
        if (forestT > 0) c.lerp(fc, forestT * landT);
      }

      const idx = (y * w + x) * 4;
      img.data[idx] = c.r * 255;
      img.data[idx + 1] = c.g * 255;
      img.data[idx + 2] = c.b * 255;
      img.data[idx + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

function makeOceanPrototypeTexture(slug) {
  const w = 512, h = 256;
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  const seed = hashString(slug);

  const mode = $('oceanMode').value;
  let usedPhoto = false;
  if (mode === 'photo') {
    usedPhoto = paintOceanFromPhoto(ctx, w, h, seed, {
      warpScale: parseFloat($('protoWarpScale').value),
      warpAmount: parseFloat($('protoWarpAmount').value),
      hueShift: parseFloat($('protoHueShift').value),
      satMul: parseFloat($('protoSatMul').value),
      lightAdd: parseFloat($('protoLightAdd').value),
    });
  }
  if (!usedPhoto) {
    paintOceanPrototype(ctx, w, h, seed, {
      oceanColor: $('protoOceanColor').value,
      landColor: $('protoLandColor').value,
      forestColor: $('protoForestColor').value,
      landScale: parseFloat($('protoLandScale').value),
      landThreshold: parseFloat($('protoLandThreshold').value),
      edgeSharpness: parseFloat($('protoEdgeSharpness').value),
      seamMargin: parseFloat($('protoSeamMargin').value),
      forestScale: parseFloat($('protoForestScale').value),
      forestThreshold: parseFloat($('protoForestThreshold').value),
    });
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function regenerate() {
  const type = $('planetType').value || undefined;
  const slug = $('slug').value || 'lab-test';
  const size = parseFloat($('size').value);

  const texture = $('protoOceanEnabled').checked
    ? makeOceanPrototypeTexture(slug)
    : makePlanetTexture('#888888', slug, size, type);
  texture.needsUpdate = true;
  material.map = texture;
  material.needsUpdate = true;

  // The CanvasTexture's own source canvas — draw it straight into the
  // preview so what's actually painted is visible independent of the
  // sphere's lighting/UV wrap.
  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  previewCtx.imageSmoothingEnabled = false;
  previewCtx.drawImage(texture.image, 0, 0, previewCanvas.width, previewCanvas.height);
}

const $ = (id) => document.getElementById(id);
$('planetType').addEventListener('change', regenerate);
$('slug').addEventListener('input', regenerate);
$('size').addEventListener('input', (e) => {
  e.target.parentElement.querySelector('output').textContent = e.target.value;
  regenerate();
});
$('regen').addEventListener('click', () => {
  $('slug').value = `lab-test-${Math.floor(Math.random() * 100000)}`;
  regenerate();
});
$('useRealLighting').addEventListener('change', (e) => {
  scene.remove(hemi, sun, flatLight);
  if (e.target.checked) scene.add(hemi, sun);
  else scene.add(flatLight);
});
$('autoRotate').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });

$('protoOceanEnabled').addEventListener('change', regenerate);
$('oceanMode').addEventListener('change', (e) => {
  const isPhoto = e.target.value === 'photo';
  $('photoControls').style.display = isPhoto ? '' : 'none';
  $('flatControls').style.display = isPhoto ? 'none' : '';
  regenerate();
});
['protoWarpScale', 'protoWarpAmount', 'protoHueShift', 'protoSatMul', 'protoLightAdd'].forEach((id) => {
  $(id).addEventListener('input', (e) => {
    e.target.parentElement.querySelector('output').textContent = e.target.value;
    regenerate();
  });
  $(id).parentElement.querySelector('output').textContent = $(id).value;
});
$('protoOceanColor').addEventListener('input', regenerate);
$('protoLandColor').addEventListener('input', regenerate);
$('protoForestColor').addEventListener('input', regenerate);
['protoLandScale', 'protoLandThreshold', 'protoEdgeSharpness', 'protoSeamMargin', 'protoForestScale', 'protoForestThreshold'].forEach((id) => {
  $(id).addEventListener('input', (e) => {
    e.target.parentElement.querySelector('output').textContent = e.target.value;
    regenerate();
  });
  $(id).parentElement.querySelector('output').textContent = $(id).value;
});
$('size').parentElement.querySelector('output').textContent = $('size').value;

regenerate();

// Debug hook only — lets a devtools console (or a CDP script) poke at the
// scene directly while iterating; harmless on a scratch/unlinked page.
window.__lab = { scene, camera, mesh, material, controls, THREE };

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
