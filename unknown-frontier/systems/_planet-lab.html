<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Planet Lab — scratch, not linked from the site</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #060a0a;
    color: #ccd4d0;
    font: 13px/1.4 monospace;
    overflow: hidden;
  }
  #viewport { position: fixed; inset: 0; }
  #panel {
    position: fixed;
    top: 12px;
    left: 12px;
    width: 260px;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    background: rgba(6, 10, 10, 0.88);
    border: 1px solid rgba(201, 168, 76, 0.35);
    border-radius: 8px;
    padding: 12px;
  }
  #panel h1 {
    font-size: 13px;
    margin: 0 0 10px;
    color: #c9a84c;
    letter-spacing: 0.05em;
  }
  #panel label { display: block; margin-top: 10px; color: #8fa39c; }
  #panel select, #panel input[type="text"], #panel input[type="range"] { width: 100%; }
  #panel input[type="checkbox"] { margin-right: 6px; }
  #panel .row { display: flex; align-items: center; gap: 8px; }
  #panel .row output { width: 42px; text-align: right; color: #ccd4d0; }
  #panel button {
    width: 100%;
    margin-top: 12px;
    padding: 6px;
    background: #c9a84c;
    color: #060a0a;
    border: none;
    border-radius: 4px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
  }
  #panel .hint { color: #5c6f68; margin-top: 12px; font-size: 11px; }
  #panel .swatch { display: inline-block; width: 100%; margin-top: 6px; border: 1px solid #2a332f; image-rendering: pixelated; }
</style>
</head>
<body>

<div id="viewport"></div>

<div id="panel">
  <h1>🪐 PLANET LAB (scratch — not linked from the site)</h1>

  <label>Tipo
    <select id="planetType">
      <option value="roccioso">Roccioso</option>
      <option value="desertico">Desertico</option>
      <option value="vulcanico">Vulcanico</option>
      <option value="oceanico" selected>Oceanico</option>
      <option value="glaciale">Glaciale</option>
      <option value="giungla">Giungla</option>
      <option value="tossico">Tossico</option>
      <option value="esotico">Esotico</option>
      <option value="gg">Gigante gassoso</option>
      <option value="gh">Gigante di ghiaccio</option>
      <option value="">(nessuno — fallback per luna)</option>
    </select>
  </label>

  <label>Slug (seed) <input type="text" id="slug" value="lab-test-a"></label>
  <label>Size (per fallback gas/icy roll) <div class="row"><input type="range" id="size" min="0.5" max="3" step="0.05" value="1.5"><output></output></div></label>

  <label><input type="checkbox" id="useRealLighting" checked> Illuminazione reale del sito (Hemisphere + Directional)</label>
  <label><input type="checkbox" id="autoRotate" checked> Auto-rotazione</label>

  <button id="regen">Rigenera texture (nuovo giro)</button>

  <h1 style="margin-top:16px">🌊 Prototipo oceanico</h1>
  <label><input type="checkbox" id="protoOceanEnabled" checked> Attivo (bypassa makePlanetTexture)</label>

  <label>Colore oceano <input type="color" id="protoOceanColor" value="#3a72a3"></label>
  <label>Colore terreno <input type="color" id="protoLandColor" value="#a08a5c"></label>
  <label>Colore foresta <input type="color" id="protoForestColor" value="#2f6b3a"></label>
  <label>Colore calotta <input type="color" id="polarCapColor" value="#dfe6e6"></label>

  <label>Scala terreno <div class="row"><input type="range" id="protoLandScale" min="1" max="8" step="0.1" value="3"><output></output></div></label>
  <label>Copertura terreno <div class="row"><input type="range" id="protoLandThreshold" min="0.3" max="0.8" step="0.01" value="0.55"><output></output></div></label>
  <label>Nitidezza costa <div class="row"><input type="range" id="protoEdgeSharpness" min="0" max="0.15" step="0.002" value="0"><output></output></div></label>
  <label>Scala foresta <div class="row"><input type="range" id="protoForestScale" min="2" max="15" step="0.1" value="6"><output></output></div></label>
  <label>Copertura foresta <div class="row"><input type="range" id="protoForestThreshold" min="0.3" max="0.8" step="0.01" value="0.5"><output></output></div></label>

  <p class="hint" style="margin-top:14px">Calotte polari</p>
  <label>Calotta polare (altezza) <div class="row"><input type="range" id="polarCap" min="0" max="0.2" step="0.005" value="0.07"><output></output></div></label>
  <label>Frastagliatura calotta <div class="row"><input type="range" id="polarJitter" min="0" max="0.08" step="0.002" value="0.03"><output></output></div></label>
  <label>Spazio acqua dopo calotta <div class="row"><input type="range" id="polarWater" min="0" max="0.2" step="0.005" value="0.06"><output></output></div></label>
  <label><input type="checkbox" id="debugZone"> Evidenzia area continenti (debug)</label>

  <button id="randomizeParams">Randomizza parametri (nuovo pianeta)</button>

  <label>Anteprima texture 2D (quella che va sulla sfera)</label>
  <canvas id="preview" class="swatch" width="256" height="128"></canvas>

  <p class="hint">Usa la vera <code>makePlanetTexture</code> da js/planet-texture.js — nessuna reimplementazione. Trascina per ruotare · scroll per zoom.</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { makePlanetTexture } from '../js/planet-texture.js';

const viewport = document.getElementById('viewport');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 0, 3.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
viewport.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.4;
controls.maxDistance = 20;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;

// Same rig as solar-system.js's makeBodyMesh lighting, so this lab shows
// exactly what the real site would render — flip off to isolate whether
// an issue is in the texture itself vs. how the scene lights it.
const hemi = new THREE.HemisphereLight(0xffffff, 0x0a0e18, 0.9);
const sun = new THREE.DirectionalLight(0xfff2d6, 1.3);
sun.position.set(40, 60, 30);
scene.add(hemi, sun);

// A flat, even fill so the texture's own colors are visible undistorted
// by the site's lighting — the "is it the texture or the lighting"
// toggle's off state.
const flatLight = new THREE.AmbientLight(0xffffff, 1.2);

const geometry = new THREE.SphereGeometry(1, 48, 48);
let material = new THREE.MeshStandardMaterial({ roughness: 0.8, metalness: 0.05 });
const mesh = new THREE.Mesh(geometry, material);
scene.add(mesh);

const previewCanvas = document.getElementById('preview');
const previewCtx = previewCanvas.getContext('2d');

// === Ocean prototype — flat color fields instead of noisy/blurred shading ===
// The live-tuned replacement for planet-texture.js's paintOcean/paintRegions:
// user feedback was that the fbm-shaded version reads as too smeared/grainy.
// Two earlier alternatives (a real Earth photo warped+recolored, and
// "continent stamp" vector shapes) were tried and dropped — this flat
// per-pixel threshold version is the one that stuck. Self-contained (own
// tiny hash/noise) so it can be tuned freely here without touching the
// real module until the look is locked in.
function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function smootherstep(t) { return t * t * (3 - 2 * t); }

// 3D value noise, used to sample the land field on a *cylinder* (see
// paintOceanPrototype below) instead of a flat u/v rectangle — cos/sin of
// u*2*PI are exactly periodic at u=0/u=1, so wrapping the noise input
// around a circle that way makes the coastline seamless by construction,
// the same trick the polar caps already use (sine harmonics) rather than
// patching a seam after the fact.
function hashLattice3(seed, ix, iy, iz) {
  let h = seed | 0;
  h ^= Math.imul(ix | 0, 0x27d4eb2f);
  h ^= Math.imul(iy | 0, 0x165667b1);
  h ^= Math.imul(iz | 0, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h ^= h >>> 13;
  h = Math.imul(h, 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}

function makeNoise3D(seed) {
  function noise3D(x, y, z) {
    const x0 = Math.floor(x), y0 = Math.floor(y), z0 = Math.floor(z);
    const sx = smootherstep(x - x0), sy = smootherstep(y - y0), sz = smootherstep(z - z0);
    const h = (ix, iy, iz) => hashLattice3(seed, ix, iy, iz);
    const nx00 = h(x0, y0, z0) + (h(x0 + 1, y0, z0) - h(x0, y0, z0)) * sx;
    const nx10 = h(x0, y0 + 1, z0) + (h(x0 + 1, y0 + 1, z0) - h(x0, y0 + 1, z0)) * sx;
    const nx01 = h(x0, y0, z0 + 1) + (h(x0 + 1, y0, z0 + 1) - h(x0, y0, z0 + 1)) * sx;
    const nx11 = h(x0, y0 + 1, z0 + 1) + (h(x0 + 1, y0 + 1, z0 + 1) - h(x0, y0 + 1, z0 + 1)) * sx;
    const nxy0 = nx00 + (nx10 - nx00) * sy;
    const nxy1 = nx01 + (nx11 - nx01) * sy;
    return nxy0 + (nxy1 - nxy0) * sz;
  }
  function fbm(x, y, z, octaves = 4, lacunarity = 2, persistence = 0.5) {
    let amp = 1, freq = 1, sum = 0, norm = 0;
    for (let o = 0; o < octaves; o++) {
      sum += noise3D(x * freq, y * freq, z * freq) * amp;
      norm += amp;
      amp *= persistence;
      freq *= lacunarity;
    }
    return sum / norm;
  }
  return { noise3D, fbm };
}

function clamp01(v) { return Math.min(1, Math.max(0, v)); }

function mulberry32(seed) {
  let a = seed;
  return function random() {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// === Polar ice caps ===
// A sphere's equirectangular top/bottom row all maps to the same single
// point (the pole) — whatever's painted there always looks like a messy
// pinch/seam from any angle, no matter how good the coastlines are. A
// solid ice cap sidesteps the problem: a pinch in a flat field is
// invisible, and it doubles as a normal-looking polar ice cap. Drawn last
// so it overlays land/forest near the poles too.
//
// The cap's edge is a sum of a few integer-frequency sine harmonics over
// u*2*PI rather than fbm noise — sin(k*u*2*PI) is exactly periodic at
// u=0/u=1 for any integer k, so the jagged coastline wraps perfectly at
// the seam for free, no margin trick needed (unlike the land mask below,
// whose fbm field isn't periodic in u).
function makeEdgeProfile(random, harmonicCount, amplitude) {
  const harmonics = [];
  for (let i = 0; i < harmonicCount; i++) {
    harmonics.push({
      freq: 2 + Math.floor(random() * 4),
      amp: (amplitude * (0.4 + random() * 0.6)) / (i + 1),
      phase: random() * Math.PI * 2,
    });
  }
  const maxAmp = harmonics.reduce((sum, h) => sum + h.amp, 0);
  const edgeAt = (u) => harmonics.reduce((sum, h) => sum + Math.sin(h.freq * u * Math.PI * 2 + h.phase) * h.amp, 0);
  return { edgeAt, maxAmp };
}

// Same seeded harmonics computed without touching ctx, so the land mask
// can know each cap's worst-case (max jagged excursion) edge position in
// px from its pole *before* anything is drawn, and drawPolarCaps (below)
// reproduces the identical shape when it actually paints — same seed in,
// same harmonics out, every time.
function computeCapMargins(seed, capFraction, jitterFraction, h) {
  if (capFraction <= 0) return { topMaxPx: 0, botMaxPx: 0 };
  const baseCapPx = capFraction * h;
  const jitterPx = jitterFraction * h;
  const top = makeEdgeProfile(mulberry32(seed ^ 0x51ed270b), 3, jitterPx);
  const bot = makeEdgeProfile(mulberry32(seed ^ 0x2545f491), 3, jitterPx);
  return { topMaxPx: baseCapPx + top.maxAmp, botMaxPx: baseCapPx + bot.maxAmp };
}

function drawPolarCaps(ctx, w, h, seed, capFraction, jitterFraction, color) {
  if (capFraction <= 0) return;
  const baseCapPx = capFraction * h;
  const jitterPx = jitterFraction * h;
  const steps = Math.max(32, Math.floor(w / 4));

  const top = makeEdgeProfile(mulberry32(seed ^ 0x51ed270b), 3, jitterPx);
  const bot = makeEdgeProfile(mulberry32(seed ^ 0x2545f491), 3, jitterPx);

  ctx.fillStyle = color;

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(w, 0);
  for (let i = steps; i >= 0; i--) {
    const x = (i / steps) * w;
    const y = Math.max(0, baseCapPx + top.edgeAt(x / w));
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0, h);
  ctx.lineTo(w, h);
  for (let i = steps; i >= 0; i--) {
    const x = (i / steps) * w;
    const y = Math.min(h, h - baseCapPx + bot.edgeAt(x / w));
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
}

function paintOceanPrototype(ctx, w, h, seed, opts) {
  const { fbm } = makeNoise3D(seed);
  const oc = new THREE.Color(opts.oceanColor);
  const lc = new THREE.Color(opts.landColor);
  const fc = new THREE.Color(opts.forestColor);
  const img = ctx.createImageData(w, h);
  const c = new THREE.Color();

  // No land inside the cap's worst-case jagged reach plus a pure-water
  // buffer beyond it — otherwise jagged land could poke directly out of
  // jagged ice with no visual break between them.
  const capMargins = computeCapMargins(seed, opts.polarCap, opts.polarJitter, h);
  const waterPx = opts.polarWater * h;
  const topSafePx = capMargins.topMaxPx + waterPx;
  const botSafePx = h - capMargins.botMaxPx - waterPx;

  // Sampling a flat 2D noise field at (u*scale, v*scale) isn't periodic in
  // u, so u=0 and u=1 land on unrelated noise — wrapped onto a sphere
  // that's the equirectangular seam, showing up as a hard break in the
  // coastline. Every attempt to patch that after the fact (fading land out
  // near the edges, then a fixed-width margin, then a per-row-varying
  // margin) still read as an artificial wall, because the underlying field
  // itself wasn't actually seamless. The fix instead: sample 3D noise on a
  // circle (cos(u*2*PI), sin(u*2*PI)) rather than a line — since cos/sin
  // are exactly periodic, u=0 and u=1 map to the *same* point on that
  // circle, so the field is seamless by construction and no margin/fade
  // logic is needed at all.
  const landRing = opts.landScale / (Math.PI * 2);
  const forestRing = opts.forestScale / (Math.PI * 2);

  for (let y = 0; y < h; y++) {
    const v = y / h;
    for (let x = 0; x < w; x++) {
      const u = x / w;
      const angle = u * Math.PI * 2;

      const landN = fbm(Math.cos(angle) * landRing, Math.sin(angle) * landRing, v * opts.landScale, 4);
      let landT = opts.edgeSharpness > 0
        ? clamp01((landN - opts.landThreshold) / opts.edgeSharpness)
        : (landN > opts.landThreshold ? 1 : 0);

      if (y < topSafePx || y > botSafePx) landT = 0;

      if (landT <= 0) {
        c.copy(oc);
      } else {
        const forestN = fbm(Math.cos(angle) * forestRing + 50, Math.sin(angle) * forestRing + 50, v * opts.forestScale, 3);
        const forestT = opts.edgeSharpness > 0
          ? clamp01((forestN - opts.forestThreshold) / opts.edgeSharpness)
          : (forestN > opts.forestThreshold ? 1 : 0);

        c.copy(oc).lerp(lc, landT);
        if (forestT > 0) c.lerp(fc, forestT * landT);
      }

      if (opts.debugZone && y >= topSafePx && y <= botSafePx) {
        c.lerp(new THREE.Color('#ff00ff'), 0.3);
      }

      const idx = (y * w + x) * 4;
      img.data[idx] = c.r * 255;
      img.data[idx + 1] = c.g * 255;
      img.data[idx + 2] = c.b * 255;
      img.data[idx + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  drawPolarCaps(ctx, w, h, seed, opts.polarCap, opts.polarJitter, opts.polarCapColor);
}

function makeOceanPrototypeTexture(slug) {
  const w = 512, h = 256;
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  const seed = hashString(slug);

  paintOceanPrototype(ctx, w, h, seed, {
    oceanColor: $('protoOceanColor').value,
    landColor: $('protoLandColor').value,
    forestColor: $('protoForestColor').value,
    landScale: parseFloat($('protoLandScale').value),
    landThreshold: parseFloat($('protoLandThreshold').value),
    edgeSharpness: parseFloat($('protoEdgeSharpness').value),
    forestScale: parseFloat($('protoForestScale').value),
    forestThreshold: parseFloat($('protoForestThreshold').value),
    polarCap: parseFloat($('polarCap').value),
    polarJitter: parseFloat($('polarJitter').value),
    polarWater: parseFloat($('polarWater').value),
    polarCapColor: $('polarCapColor').value,
    debugZone: $('debugZone').checked,
  });

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function regenerate() {
  const type = $('planetType').value || undefined;
  const slug = $('slug').value || 'lab-test';
  const size = parseFloat($('size').value);

  const texture = $('protoOceanEnabled').checked
    ? makeOceanPrototypeTexture(slug)
    : makePlanetTexture('#888888', slug, size, type);
  texture.needsUpdate = true;
  material.map = texture;
  material.needsUpdate = true;

  // The CanvasTexture's own source canvas — draw it straight into the
  // preview so what's actually painted is visible independent of the
  // sphere's lighting/UV wrap.
  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
  previewCtx.imageSmoothingEnabled = false;
  previewCtx.drawImage(texture.image, 0, 0, previewCanvas.width, previewCanvas.height);
}

const $ = (id) => document.getElementById(id);
$('planetType').addEventListener('change', regenerate);
$('slug').addEventListener('input', regenerate);
$('size').addEventListener('input', (e) => {
  e.target.parentElement.querySelector('output').textContent = e.target.value;
  regenerate();
});
$('regen').addEventListener('click', () => {
  $('slug').value = `lab-test-${Math.floor(Math.random() * 100000)}`;
  regenerate();
});
$('useRealLighting').addEventListener('change', (e) => {
  scene.remove(hemi, sun, flatLight);
  if (e.target.checked) scene.add(hemi, sun);
  else scene.add(flatLight);
});
$('autoRotate').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });

$('protoOceanEnabled').addEventListener('change', regenerate);
$('protoOceanColor').addEventListener('input', regenerate);
$('protoLandColor').addEventListener('input', regenerate);
$('protoForestColor').addEventListener('input', regenerate);
$('polarCapColor').addEventListener('input', regenerate);
$('debugZone').addEventListener('change', regenerate);
['protoLandScale', 'protoLandThreshold', 'protoEdgeSharpness', 'protoForestScale', 'protoForestThreshold', 'polarCap', 'polarJitter', 'polarWater'].forEach((id) => {
  $(id).addEventListener('input', (e) => {
    e.target.parentElement.querySelector('output').textContent = e.target.value;
    regenerate();
  });
  $(id).parentElement.querySelector('output').textContent = $(id).value;
});
$('size').parentElement.querySelector('output').textContent = $('size').value;

// Picks a new random value (within its own min/max) for every slider, plus
// plausible-but-varied hues for the three colors — an "ocean world"
// shouldn't always be the exact same blue/tan/green. Kept in loose color
// families (blue-cyan ocean, tan-brown-olive land, green forest) rather
// than fully random RGB so it stays readable as land/water/vegetation
// rather than becoming an esotico-style palette.
function randomInRange(input) {
  const min = parseFloat(input.min);
  const max = parseFloat(input.max);
  const step = parseFloat(input.step) || 0;
  let v = min + Math.random() * (max - min);
  if (step > 0) v = Math.round(v / step) * step;
  return Math.min(max, Math.max(min, v));
}

function randomHueColor(hueMin, hueMax, satRange, lightRange) {
  const hue = (hueMin + Math.random() * (hueMax - hueMin)) / 360;
  const sat = satRange[0] + Math.random() * (satRange[1] - satRange[0]);
  const light = lightRange[0] + Math.random() * (lightRange[1] - lightRange[0]);
  return `#${new THREE.Color().setHSL(hue, sat, light).getHexString()}`;
}

$('randomizeParams').addEventListener('click', () => {
  ['protoLandScale', 'protoLandThreshold', 'protoForestScale', 'protoForestThreshold', 'polarCap', 'polarJitter', 'polarWater'].forEach((id) => {
    const input = $(id);
    input.value = randomInRange(input);
    input.parentElement.querySelector('output').textContent = input.value;
  });
  $('protoOceanColor').value = randomHueColor(185, 225, [0.45, 0.75], [0.35, 0.55]);
  $('protoLandColor').value = randomHueColor(25, 95, [0.3, 0.65], [0.4, 0.62]);
  $('protoForestColor').value = randomHueColor(95, 150, [0.3, 0.6], [0.22, 0.4]);
  $('slug').value = `lab-test-${Math.floor(Math.random() * 100000)}`;
  regenerate();
});

regenerate();

// Debug hook only — lets a devtools console (or a CDP script) poke at the
// scene directly while iterating; harmless on a scratch/unlinked page.
window.__lab = { scene, camera, mesh, material, controls, THREE };

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
