<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solmira — Unknown Frontier</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/unknown-frontier.css">
</head>
<body data-system-slug="solmira">

<div class="topbar">
  <a class="back-btn" href="../unknown-frontier.html">← <span>Unknown Frontier</span></a>
  <span class="topbar-title">Solmira</span>
  <audio id="ambient-audio" src="../music/Beyond-the-Nebula.mp3" loop preload="auto"></audio>
  <button type="button" id="audio-toggle" class="audio-toggle" aria-pressed="false" aria-label="Attiva o disattiva la musica">♪</button>
</div>

<div id="solar-system" class="solar-system-canvas">
  <p class="hz-hint">Trascina per ruotare · Scroll per zoom · Click su un corpo per info</p>
</div>
<div id="hud-column" class="hud-column">
<div id="system-list" class="system-list is-collapsed">
  <button type="button" class="system-list-title" aria-expanded="false">
    <span>Corpi Rilevati</span>
    <span class="system-list-caret" aria-hidden="true">▾</span>
  </button>
  <ul class="system-list-items"></ul>
</div>
<div id="beacon-card" class="beacon-card">
  <button class="beacon-card-close" aria-label="Chiudi">&times;</button>
  <p class="placeholder-badge">In Costruzione</p>
  <p class="placeholder-eyebrow beacon-card-eyebrow">Pianeta</p>
  <h3 class="beacon-card-title">Corpo sconosciuto</h3>
  <p class="beacon-card-note"></p>
  <a class="beacon-card-link" href="#">Esplora →</a>
</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="../js/solar-system.js"></script>

<script src="../js/ambient-audio.js"></script>

</body>
</html>
