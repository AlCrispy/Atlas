<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaret — La Campagna</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/avaret.css">
<script type="module" src="js/avaret-campaign.js"></script>
</head>
<body>

<nav class="topbar">
  <a class="back-btn" href="../index.html">← Ambientazioni</a>
  <span class="topbar-title">Avaret</span>
</nav>

<header class="hero">
  <p class="hero-eyebrow">Diario della Compagnia</p>
  <h1 class="hero-title">Avaret</h1>
  <div class="hero-rule"><span>✦</span></div>
  <div class="hero-stats">
    <div><span id="count-sessions">0</span><small>Sessioni</small></div>
    <div><span id="count-places">0</span><small>Luoghi</small></div>
    <div><span id="count-items">0</span><small>Oggetti</small></div>
  </div>
</header>

<main class="campaign-layout">

  <aside class="panel panel-places" aria-labelledby="places-heading">
    <div class="panel-head">
      <h2 id="places-heading" class="panel-title">Luoghi Esplorati</h2>
      <span class="panel-count" id="places-count">0</span>
    </div>
    <ul class="place-list" id="places"></ul>
  </aside>

  <section class="timeline-col" aria-labelledby="timeline-heading">
    <div class="chapter-heading">
      <span class="chapter-title" id="timeline-heading">Cronologia delle Sessioni</span>
      <div class="chapter-line"></div>
    </div>
    <div class="timeline" id="timeline"></div>
  </section>

  <aside class="panel panel-inventory" aria-labelledby="inventory-heading">
    <div class="panel-head">
      <h2 id="inventory-heading" class="panel-title">Inventario</h2>
      <span class="panel-count" id="inventory-count">0</span>
    </div>
    <div class="slot-grid" id="inventory"></div>
    <div class="inventory-lost" id="inventory-lost" hidden>
      <p class="panel-subtitle">Perduti o consegnati</p>
      <div class="slot-grid"></div>
    </div>
  </aside>

</main>

<dialog class="detail-dialog" id="detail-dialog">
  <button class="detail-close" type="button" aria-label="Chiudi">✕</button>
  <div class="detail-body"></div>
</dialog>

<footer class="footer">Avaret · Atlante delle Ambientazioni</footer>

</body>
</html>
